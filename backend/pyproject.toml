[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marksurvey-api"
version = "0.1.0"
description = "MarkSurvey online survey system API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosmtplib>=5.1.3,<6.0.0",
  "email-validator>=2.3.0,<3.0.0",
  "fastapi>=0.152.0,<1.0.0",
  "pillow>=13.0.0,<14.0.0",
  "pydantic-settings>=2.16.1,<3.0.0",
  "pymongo>=4.19.0,<5.0.0",
  "pwdlib[argon2]>=0.3.1,<1.0.0",
  "uvicorn[standard]>=0.54.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.15.1,<3.0.0",
  "pytest>=9.1.1,<10.0.0",
  "ruff>=0.17.1,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
